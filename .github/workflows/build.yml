name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build win-x64 single-file
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Hycl.Launcher.sln -c Release

      # 自包含 + 单文件 + 裁剪（csproj 内随 PublishSingleFile 启用压缩/R2R/裁剪）：
      # 目标机器无需安装 .NET 运行时，发布产物只有一个可双击运行的 exe。
      - name: Publish self-contained single-file
        run: >
          dotnet publish src/Hycl.Launcher.UI/Hycl.Launcher.UI.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path publish -File)
          if ($files.Count -ne 1) {
            throw "发布目录应只包含一个 exe，实际为 $($files.Count) 个文件：$($files.Name -join ', ')"
          }
          $exe = $files[0]
          if ($exe.Extension -ne '.exe') {
            throw "发布产物不是 exe：$($exe.Name)"
          }
          # 自包含单文件应明显大于纯托管程序集，用于识别误发布为框架依赖/多文件的情况
          # 启用压缩 + R2R + 裁剪后产物约 40MB 量级，阈值从 50MB 下调避免误判
          if ($exe.Length -lt 25MB) {
            throw "发布产物大小异常（$([math]::Round($exe.Length / 1MB, 1)) MB），可能不是自包含单文件"
          }
          Rename-Item -Path $exe.FullName -NewName 'Hycl.exe'
          $renamed = Get-Item -Path publish/Hycl.exe
          Write-Host "产物：$($renamed.Name)，大小 $([math]::Round($renamed.Length / 1MB, 1)) MB"

      # 框架依赖（对齐 PCL-CE 的 --no-self-contained 分发）：体积小一个数量级，
      # 要求目标机器已装 .NET 10 Desktop Runtime——Hycl 启动时的环境检测会拦截并给出下载入口。
      # 压缩/裁剪仅支持自包含；R2R 在 framework-dependent 单文件下实测会随机 coreclr fail-fast
      # （0xc0000602，自包含不受影响），一并关闭。
      - name: Publish framework-dependent single-file
        run: >
          dotnet publish src/Hycl.Launcher.UI/Hycl.Launcher.UI.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=false
          -p:PublishReadyToRun=false
          -p:DebugType=None -p:DebugSymbols=false
          -o publish-ff

      - name: Verify framework-dependent output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path publish-ff -File)
          if ($files.Count -ne 1) {
            throw "发布目录应只包含一个 exe，实际为 $($files.Count) 个文件：$($files.Name -join ', ')"
          }
          $exe = $files[0]
          if ($exe.Extension -ne '.exe') {
            throw "发布产物不是 exe：$($exe.Name)"
          }
          # 框架依赖单文件含 R2R 预编译代码约 15MB 量级；过小说明丢了托管程序集，过大说明误发布了运行时
          if ($exe.Length -lt 3MB -or $exe.Length -gt 40MB) {
            throw "框架依赖产物大小异常（$([math]::Round($exe.Length / 1MB, 1)) MB）"
          }
          Rename-Item -Path $exe.FullName -NewName 'Hycl-ff.exe'
          $renamed = Get-Item -Path publish-ff/Hycl-ff.exe
          Write-Host "产物：$($renamed.Name)，大小 $([math]::Round($renamed.Length / 1MB, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hycl-win-x64
          path: publish/Hycl.exe
          if-no-files-found: error

      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hycl-win-x64-framework-dependent
          path: publish-ff/Hycl-ff.exe
          if-no-files-found: error
