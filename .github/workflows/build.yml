name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # 快速编译检查：TreatWarningsAsErrors=true，任何平台相关警告都会在这里先暴露
  compile:
    name: Compile check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build Hycl.Launcher.sln -c Release --nologo

  # 六平台产物：win / linux / mac × x64 / arm64。
  # 单文件与压缩由 UI csproj 在 PublishSingleFile=true 时自动启用。
  # R2R 默认关闭：它让自包含单文件从 ~47.9 MB 涨到 ~59.2 MB，体积换来的首帧收益不划算。
  # 裁剪必须关闭：动态加载的插件 dll 引用 System.Runtime 等框架 facade，裁剪版会移除它们。
  # 交叉 RID 发布（含跨 OS 与跨架构）已在 Windows 主机上实测 linux-x64 / osx-arm64 通过。
  # Linux 锁定 ubuntu-24.04：ubuntu-latest 正迁移到 Ubuntu 26，固定版本可消除迁移告警。
  # osx 两个 RID 交叉编译（.NET 自包含发布支持跨 OS/跨架构，产物与本机编译一致），
  # 不再排队 macOS arm64 runner：规避容量排队告警，也顺带缩短等待时间。
  publish:
    name: Publish ${{ matrix.rid }}
    needs: compile
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, ext: '.exe' }
          - { rid: win-arm64,   os: windows-latest, ext: '.exe' }
          - { rid: linux-x64,   os: ubuntu-24.04,   ext: '' }
          - { rid: linux-arm64, os: ubuntu-24.04,   ext: '' }
          - { rid: osx-x64,     os: ubuntu-24.04,   ext: '' }
          - { rid: osx-arm64,   os: ubuntu-24.04,   ext: '' }
    env:
      RID: ${{ matrix.rid }}
      EXT: ${{ matrix.ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # 自包含 + 单文件：目标机器无需安装 .NET 运行时
      - name: Publish self-contained single-file
        shell: bash
        run: >
          dotnet publish src/Hycl.Launcher.UI/Hycl.Launcher.UI.csproj
          -c Release -r "$RID" --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: Verify self-contained output
        shell: bash
        run: |
          node .github/scripts/verify-publish.cjs publish "Hycl$EXT" 12 150
          if [ "$RUNNER_OS" != "Windows" ]; then chmod +x "publish/Hycl$EXT"; fi

      # 框架依赖单文件：体积小一个数量级，要求目标机器已装 .NET 10 Desktop Runtime。
      # 压缩/裁剪不支持非自包含；R2R 在 framework-dependent 单文件下实测会随机 fail-fast，一并关闭。
      - name: Publish framework-dependent single-file
        shell: bash
        run: >
          dotnet publish src/Hycl.Launcher.UI/Hycl.Launcher.UI.csproj
          -c Release -r "$RID" --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=false
          -p:PublishReadyToRun=false
          -p:DebugType=None -p:DebugSymbols=false
          -o publish-ff

      - name: Verify framework-dependent output
        shell: bash
        run: |
          node .github/scripts/verify-publish.cjs publish-ff "Hycl-ff$EXT" 1 80
          if [ "$RUNNER_OS" != "Windows" ]; then chmod +x "publish-ff/Hycl-ff$EXT"; fi

      # macOS 裸可执行文件没有 Dock 图标/菜单栏，额外打成 .app bundle 便于双击运行
      - name: Package macOS .app bundle
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "Hycl.app/Contents/MacOS" "Hycl.app/Contents/Resources"
          cp "publish/Hycl" "Hycl.app/Contents/MacOS/Hycl"
          chmod +x "Hycl.app/Contents/MacOS/Hycl"
          cat > "Hycl.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Hycl</string>
            <key>CFBundleDisplayName</key><string>Hyplay Craft Launcher</string>
            <key>CFBundleIdentifier</key><string>eu.muqiu.hycl</string>
            <key>CFBundleExecutable</key><string>Hycl</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          zip -qr "Hycl-$RID.zip" "Hycl.app"
          ls -lh "Hycl-$RID.zip"

      - name: Upload self-contained artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hycl-${{ matrix.rid }}
          path: publish/Hycl${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hycl-${{ matrix.rid }}-framework-dependent
          path: publish-ff/Hycl-ff${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload macOS .app artifact
        if: startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hycl-${{ matrix.rid }}-app
          path: Hycl-${{ matrix.rid }}.zip
          if-no-files-found: error
