name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build win-x64 single-file
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Hycl.Launcher.sln -c Release

      # 自包含 + 单文件：目标机器无需安装 .NET 运行时，发布产物只有一个可双击运行的 exe。
      - name: Publish self-contained single-file
        run: >
          dotnet publish src/Hycl.Launcher.UI/Hycl.Launcher.UI.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path publish -File)
          if ($files.Count -ne 1) {
            throw "发布目录应只包含一个 exe，实际为 $($files.Count) 个文件：$($files.Name -join ', ')"
          }
          $exe = $files[0]
          if ($exe.Extension -ne '.exe') {
            throw "发布产物不是 exe：$($exe.Name)"
          }
          # 自包含单文件应明显大于纯托管程序集，用于识别误发布为框架依赖/多文件的情况
          # 启用压缩 + R2R 后产物约 63MB，阈值从 50MB 下调避免误判
          if ($exe.Length -lt 40MB) {
            throw "发布产物大小异常（$([math]::Round($exe.Length / 1MB, 1)) MB），可能不是自包含单文件"
          }
          Rename-Item -Path $exe.FullName -NewName 'Hycl.exe'
          $renamed = Get-Item -Path publish/Hycl.exe
          Write-Host "产物：$($renamed.Name)，大小 $([math]::Round($renamed.Length / 1MB, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hycl-win-x64
          path: publish/Hycl.exe
          if-no-files-found: error
